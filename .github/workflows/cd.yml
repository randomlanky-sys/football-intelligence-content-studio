name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    needs: [CI]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd packages/* && pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: echo "Deploying to Supabase..."
      - run: echo "Deploy complete"