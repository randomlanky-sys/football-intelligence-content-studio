services:
  - type: web
    name: football-intelligence-content-studio-web
    env: node
    plan: free
    buildCommand: cd packages/web && pnpm install && pnpm build
    startCommand: cd packages/web && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true
